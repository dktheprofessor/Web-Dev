<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            color: rgb(255, 0, 0);
        }

        img {
            width: 100vw;
            height: 100vh;
        }

        p.top {
            position: fixed;
            top: 0%;
        }

        p.mid {
            position: fixed;
            top: 50%;
        }

        p.bottom {
            position: fixed;
            bottom: 0;
        }

        * {
            margin: 0;
            padding: 0;
        }

        #centre {
            text-align: center;
        }

        #right {
            text-align: right;
        }

        p {
            width: 100%;
        }
    </style>
</head>

<body>
    <img src="AI Creator in a Modern Studio.png" alt="">
    <p class="top" id="centre">Dhruv</p>
    <p class="top">Dhruv</p>
    <p class="top" id="right">Dhruv</p>
    <p class="mid" id="centre">Dhruv</p>
    <p class="mid">Dhruv</p>
    <p class="mid" id="right">Dhruv</p>
    <p class="bottom" id="centre">Dhruv </p>
    <p class="bottom">Dhruv </p>
    <p class="bottom" id="right">Dhruv </p>
</body>

</html>
